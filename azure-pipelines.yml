trigger:
  branches:
    include:
      - main

pool:
  name: MyLocalAgent

variables:
  artifactName: 'adf-arm-templates'

stages:

# =========================
# STAGE 1 — CI (BUILD)
# =========================
- stage: Build
  jobs:
  - job: BuildJob
    steps:

    - checkout: self
      persistCredentials: true

    - powershell: |
        Write-Host "Switching to adf_publish branch"
        git fetch origin
        git checkout adf_publish
      displayName: 'Checkout adf_publish branch'

    - powershell: |
        Write-Host "=== Repository Structure ==="
        Get-ChildItem -Recurse | Select-Object FullName
      displayName: 'Show Repository Contents'

    - powershell: |
        Write-Host "Checking for ADF ARM templates..."
        Get-ChildItem -Recurse -Filter *.json | Select-Object FullName
      displayName: 'Validate ARM Templates'

    - publish: $(Build.SourcesDirectory)
      artifact: $(artifactName)
      displayName: 'Publish ADF Files as Pipeline Artifact'


# =========================
# STAGE 2 — CD (DEPLOY)
# =========================
- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployJob
    steps:

    - download: current
      artifact: $(artifactName)

    # ── NEW STEP — shows exact file paths ──────────────
    - powershell: |
        Write-Host "=== Pipeline Workspace Contents ==="
        Get-ChildItem -Path $(Pipeline.Workspace) -Recurse | Select-Object FullName
      displayName: 'Show Downloaded Artifact Contents'

    - task: AzureResourceManagerTemplateDeployment@3
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: 'azure-connection'
        subscriptionId: '4d808be8-c23a-4b5f-b5c7-c09d50e544e1'
        action: 'Create Or Update Resource Group'
        resourceGroupName: 'rg-data-engineer'
        location: 'Central India'
        templateLocation: 'Linked artifact'
        csmFile: '$(Pipeline.Workspace)/$(artifactName)/adf-data-engineer-new/ARMTemplateForFactory.json'
        csmParametersFile: '$(Pipeline.Workspace)/$(artifactName)/adf-data-engineer-new/ARMTemplateParametersForFactory.json'